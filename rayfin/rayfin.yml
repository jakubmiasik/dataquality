id: reconciliation-engine
name: Reconciliation Engine
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5175
      # Required so the Fabric-hosted app can complete the SSO handoff.
      - https://app.fabric.microsoft.com
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
