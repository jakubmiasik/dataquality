name: CI

# Checks only. Deployment to Fabric is run on demand with `npx rayfin up`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Gateway build and tests
        run: npm ci && npm test
        working-directory: gateway
